<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Electricity Forecast{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E">
<script>
  (function(){
    try{
      var saved = localStorage.getItem('theme');
      if(saved) document.documentElement.setAttribute('data-theme', saved);
    }catch(e){}
  })();
</script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('dashboard') }}">
      <span class="mark">⚡</span> Electricity Forecast <span style="color:var(--fg-faint); font-weight:400;">/ Bukit Mahkota</span>
    </a>
    <nav class="topnav">
      <a href="{{ url_for('dashboard') }}" class="{{ 'active' if active == 'dashboard' else '' }}"><span class="full">Dashboard</span></a>
      <a href="{{ url_for('predict_page') }}" class="{{ 'active' if active == 'predict' else '' }}"><span class="full">Predict</span></a>
      <button class="theme-toggle" id="themeToggle" title="Toggle theme" type="button">
        <svg id="iconMoon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <span>LSTM electricity-consumption forecaster — trained on hourly data, Nov 2022–Aug 2023.</span>
    <span>Design language borrowed from <a href="https://mukminmuwahhid.github.io/mukmin-portfolio/" target="_blank" rel="noopener">mukminmuwahhid.github.io</a></span>
  </footer>

  <script src="{{ url_for('static', filename='js/vendor/chart.umd.min.js') }}"></script>
  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
